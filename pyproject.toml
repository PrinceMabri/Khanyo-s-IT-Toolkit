[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "khanyo-it-toolkit"
dynamic = ["version"]
description = "A Windows PC troubleshooting toolkit with a categorized GUI and headless report mode."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "YOUR NAME" }]
keywords = ["windows", "it-support", "troubleshooting", "diagnostics", "tkinter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Topic :: System :: Systems Administration",
]
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
build = ["pyinstaller>=6"]

[project.scripts]
khanyo = "khanyo_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/khanyo-it-toolkit"
Issues = "https://github.com/YOUR-USERNAME/khanyo-it-toolkit/issues"

[tool.setuptools.dynamic]
version = { attr = "khanyo_toolkit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
